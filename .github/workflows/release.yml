name: Release bundle

# Run by hand from the Actions tab: builds the signed .aab to upload to Google Play.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 1.0.1"
        required: true
        default: "1.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "::error::Add the UPLOAD_KEYSTORE_BASE64 secret first (see docs/launch.md)"; exit 1; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew testReleaseUnitTest bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ambr-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
