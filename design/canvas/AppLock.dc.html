<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App lock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F2A44; font-family: 'Public Sans', system-ui, sans-serif; color: #FFFFFF; padding: 96px 28px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px">
  <span style="width: 72px; height: 72px; border-radius: 24px; background: #2B3756; display: flex; align-items: center; justify-content: center">
    <dc-import name="Icon" icon="lock" size="28" color="#FFC24D" hint-size="28px,28px"></dc-import></span>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Enter your PIN</span>
    <span style="font-size: 14px; color: #B9C1D6">Ambr is locked to keep your receipts private</span>
  </div>
  <div role="img" aria-label="{{label}}" style="display: flex; gap: 16px; padding: 8px 0">
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="{{d.style}}"></span></sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 26px; margin-top: auto">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="{{k.style}}">
        <sc-if value="{{k.num}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
        <sc-if value="{{k.finger}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="fingerprint" size="26" color="#FFC24D" hint-size="26px,26px"></dc-import></sc-if>
        <sc-if value="{{k.del}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="delete" size="24" color="#FFFFFF" hint-size="24px,24px"></dc-import></sc-if>
      </button>
    </sc-for>
  </div>
  <a href="Main.dc.html" style="font-size: 14px; font-weight: 600; color: #B9C1D6; padding: 8px">Forgot PIN? Unlock with Google</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 2 }; }
  renderVals() {
    const n = this.state.n;
    const base = 'width: 76px; height: 76px; border-radius: 50%; border: none; font: inherit; font-size: 28px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; ';
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'fp', '0', 'del'];
    return {
      label: n + ' of 4 digits entered',
      dots: [0, 1, 2, 3].map((i) => ({ style: 'width: 16px; height: 16px; border-radius: 50%; ' + (i < n ? 'background: #FFC24D' : 'border: 2px solid #4A5674; box-sizing: border-box') })),
      keys: labels.map((l) => ({
        label: l, num: l !== 'fp' && l !== 'del', finger: l === 'fp', del: l === 'del',
        aria: l === 'fp' ? 'Use fingerprint' : l === 'del' ? 'Delete digit' : l,
        style: base + (l === 'fp' || l === 'del' ? 'background: transparent' : 'background: #2B3756'),
        press: () => this.setState({ n: l === 'del' ? Math.max(0, n - 1) : l === 'fp' ? 4 : Math.min(4, n + 1) })
      }))
    };
  }
}
</script>
</body>
</html>
