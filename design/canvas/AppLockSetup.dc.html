<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App lock setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 26px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
    <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #FFF4DE; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #7A4A00"><dc-import name="Icon" icon="crown" size="12" color="#7A4A00" hint-size="12px,12px"></dc-import>Pro</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 8px 0">
    <span style="width: 88px; height: 88px; border-radius: 28px; background: #1F2A44; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 30px rgba(31, 42, 68, 0.25)"><dc-import name="Icon" icon="lock" size="36" color="#FFC24D" hint-size="36px,36px"></dc-import></span>
    <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Lock Ambr</span><span style="font-size: 15px; line-height: 1.45; color: #4A5163">Receipts show what your home owns and what it cost. Keep them for your eyes only.</span></span>
  </div>
  <div role="radiogroup" aria-label="Unlock with" style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #F4F5F8; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" icon="{{o.icon}}" size="20" color="#1D2433" hint-size="20px,20px"></dc-import></span>
        <span style="display: flex; flex-direction: column; flex: 1; text-align: left"><span style="font-size: 16px; font-weight: 700">{{o.label}}</span><span style="font-size: 13px; color: #646B7E; font-weight: 500">{{o.sub}}</span></span>
        <span style="{{o.dot}}"></span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 14px 16px">
    <span style="font-size: 15px; font-weight: 600">Lock when I leave the app</span>
    <span style="height: 36px; padding: 0 12px; border-radius: 18px; background: #F4F5F8; display: flex; align-items: center; font-size: 14px; font-weight: 600">After 1 minute</span>
  </div>
  <a href="AppLock.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #1F2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Turn on app lock</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'fp' }; }
  renderVals() {
    const O = [
      { id: 'fp', label: 'Fingerprint', sub: 'Fastest. PIN as backup', icon: 'fingerprint' },
      { id: 'pin', label: '4-digit PIN', sub: 'Works on every phone', icon: 'key' }
    ];
    return { opts: O.map((o) => {
      const on = this.state.pick === o.id;
      return Object.assign({}, o, {
        on: on, pick: () => this.setState({ pick: o.id }),
        style: 'border-radius: 22px; padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px; font: inherit; color: #1D2433; cursor: pointer; background: #FFFFFF; ' + (on ? 'border: 2px solid #1F2A44' : 'border: 2px solid transparent; box-shadow: 0 0 0 1px #E8EAF0'),
        dot: 'width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex: none; ' + (on ? 'border: 7px solid #1F2A44' : 'border: 2px solid #CDD2DC')
      });
    }) };
  }
}
</script>
</body>
</html>
