<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 26px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Vault.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center">
      <dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
    <span style="width: 44px"></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
    <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.025em">Archive</span>
    <span style="font-size: 15px; line-height: 1.45; color: #4A5163">Things you sold or gave away. Receipts stay here as proof for the new owner.</span>
  </div>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
    <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: #ECEEF2; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" icon="{{it.icon}}" size="24" color="#5F6577" hint-size="24px,24px"></dc-import></span>
        <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <span style="font-size: 16px; font-weight: 700">{{it.name}}</span>
          <span style="font-size: 13px; color: #646B7E">{{it.sub}}</span>
        </span>
        <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #ECEEF2; color: #4A5163">{{it.tag}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 22px; border: none; background: #F4F5F8; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><dc-import name="Icon" icon="share" size="14" color="#1D2433" hint-size="14px,14px"></dc-import>Share receipt</button>
        <button style="height: 44px; border-radius: 22px; border: none; background: #F4F5F8; font: inherit; font-size: 14px; font-weight: 600; color: #1D2433; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><dc-import name="Icon" icon="rotate-left" size="14" color="#1D2433" hint-size="14px,14px"></dc-import>Move back</button>
      </div>
    </div>
  </sc-for>

  <div style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start; border-radius: 18px; background: #FFF4DE; padding: 12px 14px">
    <span style="flex: none; padding-top: 1px"><dc-import name="Icon" icon="info" size="15" color="#7A4A00" hint-size="15px,15px"></dc-import></span>
    <span style="font-size: 13px; line-height: 1.45; color: #4A3300">Archived items don't count toward your 10 free items and never send reminders.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { name: 'Redmi Note 10', sub: 'Sold 4 Aug 2026 · bought for ৳22,999', tag: 'Sold', icon: 'mobile-notch' },
      { name: 'Walton fridge (old)', sub: 'Given to Khala, 12 Jan 2026', tag: 'Given away', icon: 'refrigerator' }
    ] };
  }
}
</script>
</body>
</html>
