<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0E0C; font-family: 'Public Sans', system-ui, sans-serif; color: #FFFFFF; padding: 56px 16px 28px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; background: #2A2721; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    <div role="group" aria-label="What are you scanning" style="display: flex; background: #2A2721; border-radius: 22px; padding: 4px">
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #FFFFFF; color: #1A1814; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Receipt</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Warranty card</button>
    </div>
    <button aria-label="Flash off" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #2A2721; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </div>

  <div style="flex: 1; position: relative; border-radius: 28px; background: #3A352D; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; inset: 0; background: #4A4337"></div>
    <div style="position: relative; width: 196px; background: #FBFAF6; padding: 18px 14px 26px; display: flex; flex-direction: column; gap: 7px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #3B3833; transform: rotate(-3deg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35)">
      <span style="text-align: center; font-weight: 700; font-size: 12px">WALTON PLAZA</span>
      <span style="text-align: center; color: #6B665C">Mirpur 10, Dhaka</span>
      <span style="border-top: 1px dashed #9A958B"></span>
      <span>20/10/2026  17:05</span>
      <span>WFE-3E8 GDEN-XX Fridge</span>
      <span style="display: flex; justify-content: space-between"><span>1 x</span><span>52,990.00</span></span>
      <span style="border-top: 1px dashed #9A958B"></span>
      <span style="display: flex; justify-content: space-between; font-weight: 700"><span>NET</span><span>52,990.00</span></span>
      <span style="text-align: center; color: #6B665C">1 year warranty</span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 70px; right: 70px; top: 120px; bottom: 120px">
      <span style="position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-left: 4px solid #F5A100; border-top: 4px solid #F5A100; border-top-left-radius: 14px"></span>
      <span style="position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-right: 4px solid #F5A100; border-top: 4px solid #F5A100; border-top-right-radius: 14px"></span>
      <span style="position: absolute; left: 0; bottom: 0; width: 34px; height: 34px; border-left: 4px solid #F5A100; border-bottom: 4px solid #F5A100; border-bottom-left-radius: 14px"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-right: 4px solid #F5A100; border-bottom: 4px solid #F5A100; border-bottom-right-radius: 14px"></span>
    </div>
    <span style="position: absolute; top: 18px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgba(15, 14, 12, 0.72); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600">Fit the receipt inside the frame</span>
    <span style="position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #F5A100; color: #1A1814; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #1A1814"></span>Hold steady, capturing…</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 12px">
    <button style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #2A2721; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg></span>Gallery</button>
    <a href="Confirm.dc.html" aria-label="Take photo" style="width: 80px; height: 80px; box-sizing: border-box; border-radius: 50%; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF"></span></a>
    <button style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #2A2721; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg></span>PDF</button>
  </div>

  <a href="Confirm.dc.html" style="align-self: center; font-size: 15px; font-weight: 600; color: #F5C25A; padding: 6px 12px">No receipt? Type it in</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
