<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1320; font-family: 'Public Sans', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">

  <div style="position: absolute; inset: 0; background: #3D3A35"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 160px; background: #2F2C28; opacity: 0.6"></div>

  <div style="position: absolute; left: 50%; top: 210px; transform: translateX(-50%) rotate(-3deg); width: 206px; background: #FBFAF6; padding: 18px 14px 26px; display: flex; flex-direction: column; gap: 7px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: #3B3F4A; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45)">
    <span style="text-align: center; font-weight: 700; font-size: 12px">WALTON PLAZA</span>
    <span style="text-align: center; color: #646B7E">Mirpur 10, Dhaka</span>
    <span style="border-top: 1px dashed #9AA0AE"></span>
    <span>20/10/2026  17:05</span>
    <span>WFE-3E8 GDEN-XX Fridge</span>
    <span style="display: flex; justify-content: space-between"><span>1 x</span><span>52,990.00</span></span>
    <span style="border-top: 1px dashed #9AA0AE"></span>
    <span style="display: flex; justify-content: space-between; font-weight: 700"><span>NET</span><span>52,990.00</span></span>
    <span style="text-align: center; color: #646B7E">1 year warranty</span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 76px; right: 76px; top: 186px; height: 330px">
    <span style="position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-left: 4px solid #F2A007; border-top: 4px solid #F2A007; border-top-left-radius: 18px"></span>
    <span style="position: absolute; right: 0; top: 0; width: 36px; height: 36px; border-right: 4px solid #F2A007; border-top: 4px solid #F2A007; border-top-right-radius: 18px"></span>
    <span style="position: absolute; left: 0; bottom: 0; width: 36px; height: 36px; border-left: 4px solid #F2A007; border-bottom: 4px solid #F2A007; border-bottom-left-radius: 18px"></span>
    <span style="position: absolute; right: 0; bottom: 0; width: 36px; height: 36px; border-right: 4px solid #F2A007; border-bottom: 4px solid #F2A007; border-bottom-right-radius: 18px"></span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(14, 19, 32, 0.55); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center">
      <dc-import name="Icon" icon="cross-small" size="22" color="#FFFFFF" hint-size="22px,22px"></dc-import></a>
    <div role="group" aria-label="What are you scanning" style="display: flex; background: rgba(14, 19, 32, 0.55); backdrop-filter: blur(12px); border-radius: 22px; padding: 4px">
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #FFFFFF; color: #1D2433; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Receipt</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Warranty card</button>
    </div>
    <button aria-label="Flash off" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(14, 19, 32, 0.55); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <dc-import name="Icon" icon="bolt" size="17" color="#FFFFFF" hint-size="17px,17px"></dc-import></button>
  </div>

  <span style="position: absolute; top: 124px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: rgba(14, 19, 32, 0.6); backdrop-filter: blur(12px); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600">Fit the receipt inside the frame</span>
  <span style="position: absolute; top: 540px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: #F2A007; color: #1D2433; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #1D2433"></span>Hold steady, capturing…</span>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 28px 26px; background: #0E1320; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #B9C1D6; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: #1F2A44; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="picture" size="20" color="#FFFFFF" hint-size="20px,20px"></dc-import></span>Gallery</button>
      <a href="Confirm.dc.html" aria-label="Take photo" style="width: 82px; height: 82px; box-sizing: border-box; border-radius: 50%; border: 4px solid #F2A007; display: flex; align-items: center; justify-content: center">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF"></span></a>
      <button style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #B9C1D6; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">
        <span style="width: 52px; height: 52px; border-radius: 18px; background: #1F2A44; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="file-pdf" size="20" color="#FFFFFF" hint-size="20px,20px"></dc-import></span>PDF</button>
    </div>
    <a href="Confirm.dc.html" style="align-self: center; font-size: 15px; font-weight: 600; color: #FFC24D; padding: 6px 12px">No receipt? Type it in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
