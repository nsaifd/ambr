<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}a:hover{color:#1D2433}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1420px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 130px; display: flex; flex-direction: column; gap: 14px; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Camera.dc.html" aria-label="Back to camera" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center">
      <dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
    <span style="font-size: 16px; font-weight: 700">New item</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #E4F4EA; color: #17704A; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700">
      <dc-import name="Icon" icon="sparkles" size="12" color="#17704A" hint-size="12px,12px"></dc-import>4 of 5 read</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
    <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.025em">Check the details</span>
    <span style="font-size: 15px; color: #4A5163">We read your receipt. Fix anything marked in amber.</span>
  </div>

  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 10px; display: flex; gap: 12px; align-items: center">
    <div style="width: 64px; height: 76px; border-radius: 16px; background: #EEF0F4; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden">
      <div style="width: 42px; background: #FFFFFF; padding: 5px; display: flex; flex-direction: column; gap: 3px; transform: rotate(-3deg); box-shadow: 0 2px 6px rgba(31, 42, 68, 0.10)">
        <span style="height: 3px; background: #3B3F4A; width: 70%; align-self: center"></span>
        <span style="height: 2px; background: #B9BFCB"></span><span style="height: 2px; background: #B9BFCB; width: 80%"></span><span style="height: 2px; background: #B9BFCB"></span><span style="height: 3px; background: #3B3F4A; width: 60%"></span>
      </div>
    </div>
    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 15px; font-weight: 700">Receipt · 1 page</span>
      <span style="font-size: 13px; color: #646B7E">Walton Plaza, 20 Oct 2026</span>
    </span>
    <button aria-label="View photo" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: #F4F5F8; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: 4px">
      <dc-import name="Icon" icon="expand" size="15" color="#1D2433" hint-size="15px,15px"></dc-import></button>
  </div>

  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-name" style="font-size: 13px; font-weight: 600; color: #4A5163">Item name</label>
      <input id="f-name" value="Walton frost-free fridge" style="height: 52px; border-radius: 16px; border: 1px solid #E3E6EC; background: #F7F8FA; padding: 0 14px; font-size: 16px; color: #1D2433; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="f-store" style="font-size: 13px; font-weight: 600; color: #4A5163">Store</label>
      <input id="f-store" value="Walton Plaza, Mirpur 10" style="height: 52px; border-radius: 16px; border: 1px solid #E3E6EC; background: #F7F8FA; padding: 0 14px; font-size: 16px; color: #1D2433; box-sizing: border-box">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <label for="f-price" style="font-size: 13px; font-weight: 600; color: #4A5163">Price (৳)</label>
        <input id="f-price" value="52,990" style="height: 52px; border-radius: 16px; border: 1px solid #E3E6EC; background: #F7F8FA; padding: 0 14px; font-size: 16px; color: #1D2433; box-sizing: border-box; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <label for="f-date" style="font-size: 13px; font-weight: 600; color: #4A5163">Bought on</label>
        <input id="f-date" value="20 Oct 2026" aria-describedby="f-date-hint" style="height: 52px; border-radius: 16px; border: 2px solid #F2A007; background: #FFF8EA; padding: 0 13px; font-size: 16px; color: #1D2433; box-sizing: border-box; width: 100%">
        <span id="f-date-hint" style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #7A4A00">
          <dc-import name="Icon" icon="info" size="12" color="#7A4A00" hint-size="12px,12px"></dc-import>Check this</span>
      </div>
    </div>
  </div>

  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 16px; font-weight: 700">Warranty length</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{lengths}}" as="c" hint-placeholder-count="5">
        <button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; background: #FFF4DE; border-radius: 16px; padding: 12px 14px">
      <span style="flex: none; padding-top: 1px"><dc-import name="Icon" icon="bulb" size="16" color="#7A4A00" hint-size="16px,16px"></dc-import></span>
      <span style="font-size: 13px; line-height: 1.45; color: #4A3300">Walton fridges usually have 1 year full warranty and 10 years on the compressor.</span>
    </div>
    <button style="height: 48px; border-radius: 16px; border: 1.5px dashed #CDD2DC; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1D2433; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <dc-import name="Icon" icon="plus" size="13" color="#1D2433" hint-size="13px,13px"></dc-import>Add compressor · 10 years</button>
  </div>

  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 16px; font-weight: 700">Where is it?</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
        <button aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
  </div>

  <button aria-expanded="false" style="border-radius: 24px; border: none; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; font: inherit; color: #1D2433; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; text-align: left">
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">More details</span><span style="font-size: 13px; color: #646B7E">Brand, model, serial, warranty card, notes</span></span>
    <dc-import name="Icon" icon="angle-small-down" size="20" color="#1D2433" hint-size="20px,20px"></dc-import></button>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 72px; border-radius: 36px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); box-shadow: 0 0 0 1px rgba(31, 42, 68, 0.06), 0 14px 34px rgba(31, 42, 68, 0.16); padding: 8px; box-sizing: border-box">
    <a href="Saved.dc.html" style="height: 56px; border-radius: 28px; background: #F2A007; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; color: #1D2433">
      <dc-import name="Icon" icon="check" size="16" color="#1D2433" hint-size="16px,16px"></dc-import>Save item</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { len: '1 year', room: 'Kitchen' }; }
  chip(on) {
    return 'height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ' +
      (on ? 'border: 1px solid #1F2A44; background: #1F2A44; color: #FFFFFF' : 'border: 1px solid #E3E6EC; background: #F7F8FA; color: #1D2433');
  }
  renderVals() {
    const lens = ['6 months', '1 year', '2 years', '3 years', 'Custom'];
    const rooms = ['Kitchen', 'Living room', 'Bedroom', 'Office', 'Car / bike', 'Other'];
    return {
      lengths: lens.map((l) => ({ label: l, on: this.state.len === l, style: this.chip(this.state.len === l), pick: () => this.setState({ len: l }) })),
      rooms: rooms.map((l) => ({ label: l, on: this.state.room === l, style: this.chip(this.state.room === l), pick: () => this.setState({ room: l }) }))
    };
  }
}
</script>
</body>
</html>
