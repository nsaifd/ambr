      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Saved this before?</span>
      <span style="font-size: 15px; line-height: 1.45; color: #4A5163">Looks like you already saved this receipt on 2 Jun 2026.</span>
    </div>
    <a href="ItemDetail.dc.html" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border-radius: 20px; background: #F7F8FA; padding: 10px; text-align: left">

      <span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 15px; font-weight: 700">Walton frost-free fridge</span><span style="font-size: 13px; color: #646B7E">Walton Plaza · ৳52,990</span></span>

      <a href="Confirm.dc.html" style="height: 52px; border-radius: 26px; background: #F4F5F8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Cancel</a>
