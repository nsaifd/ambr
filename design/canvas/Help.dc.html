<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help and feedback</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 26px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
    <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Help</span>
  </div>
  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #646B7E; padding: 4px 4px 0">Common questions</span>
  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 4px 16px">
    <sc-for list="{{faq}}" as="f" hint-placeholder-count="4">
      <div style="border-top: {{f.sep}}">
        <button aria-expanded="{{f.open}}" onClick="{{f.toggle}}" style="width: 100%; border: none; background: transparent; font: inherit; color: #1D2433; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; cursor: pointer; text-align: left">
          <span style="font-size: 15px; font-weight: 600">{{f.q}}</span>
          <span style="{{f.chev}}"><dc-import name="Icon" icon="angle-small-down" size="18" color="#646B7E" hint-size="18px,18px"></dc-import></span>
        </button>
        <sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: #4A5163">{{f.a}}</p></sc-if>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="border-radius: 22px; border: none; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font: inherit; color: #1D2433; cursor: pointer; text-align: left">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF4DE; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="comment-alt" size="17" color="#7A4A00" hint-size="17px,17px"></dc-import></span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Send feedback</span><span style="font-size: 12px; color: #646B7E">Ideas, bugs, a story</span></span>
    </button>
    <button style="border-radius: 22px; border: none; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font: inherit; color: #1D2433; cursor: pointer; text-align: left">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #E6F0FB; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="envelope" size="17" color="#2B5F8E" hint-size="17px,17px"></dc-import></span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Email us</span><span style="font-size: 12px; color: #646B7E">Reply within 2 days</span></span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const F = [
      { q: 'My receipt is faded. What now?', a: 'Save the photo anyway and type the item name. A warranty card or the box sticker with the serial also counts as proof at most service centers.' },
      { q: 'What if I lose my phone?', a: 'With backup on, install Ambr on the new phone and sign in to the same Google account. We find your backup and restore every item.' },
      { q: 'Which brands does Ambr know?', a: 'Walton, Singer, Samsung, Gree, Vision and more. For these we suggest the usual warranty and fill in the service center.' },
      { q: 'Can my family see my items?', a: 'Today you can share any receipt as a PDF. A shared family vault is coming with Ambr Pro.' }
    ];
    return { faq: F.map((f, i) => {
      const open = this.state.open === i;
      return Object.assign({}, f, { open: open, sep: i === 0 ? 'none' : '1px solid #EEF0F4',
        toggle: () => this.setState({ open: open ? -1 : i }),
        chev: 'display: flex; flex: none; transition: transform 0.2s; transform: rotate(' + (open ? '180' : '0') + 'deg)' });
    }) };
  }
}
</script>
</body>
</html>
