<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 26px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 12px">
      <a href="You.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Household</span>
    </span>
    <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #ECEEF2; display: flex; align-items: center; font-size: 12px; font-weight: 700; color: #4A5163">Version 2</span>
  </div>
  <span style="font-size: 15px; line-height: 1.45; color: #4A5163; padding: 0 2px">Everyone sees the same vault. No more “who has the receipt?”</span>

  <div style="border-radius: 28px; background: #1F2A44; color: #FFFFFF; padding: 18px; display: flex; align-items: center; gap: 16px">
    <span style="width: 96px; height: 96px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" icon="qrcode" size="64" color="#1D2433" hint-size="64px,64px"></dc-import></span>
    <span style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; font-weight: 700">Invite family</span>
      <span style="font-size: 13px; line-height: 1.4; color: #D5DBEA">They install Ambr and scan this code.</span>
      <span style="height: 36px; align-self: flex-start; padding: 0 14px; border-radius: 18px; background: #EF9426; color: #1D2433; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><dc-import name="Icon" icon="share" size="13" color="#1D2433" hint-size="13px,13px"></dc-import>Send link</span>
    </span>
  </div>

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #646B7E; padding: 6px 4px 0">Members · 3</span>
  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 4px 0">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: {{m.sep}}">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: {{m.bg}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: {{m.ink}}; flex: none">{{m.initial}}</span>
        <span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 15px; font-weight: 700">{{m.name}}</span><span style="font-size: 13px; color: #646B7E">{{m.sub}}</span></span>
        <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{m.tagBg}}; color: {{m.tagInk}}">{{m.role}}</span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 12px 14px">
    <span style="flex: none; padding-top: 1px"><dc-import name="Icon" icon="cloud-upload-alt" size="15" color="#1D2433" hint-size="15px,15px"></dc-import></span>
    <span style="font-size: 13px; line-height: 1.45; color: #4A5163">Synced through Nusrat's Google Drive. Each item shows who added it.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const M = [
      { name: 'Nusrat (you)', sub: 'Added 15 items', initial: 'N', bg: '#E6F0FB', ink: '#2B5F8E', role: 'Owner', tagBg: '#1F2A44', tagInk: '#FFFFFF' },
      { name: 'Rafi', sub: 'Added 6 items', initial: 'R', bg: '#FDEBDD', ink: '#9A4A16', role: 'Member', tagBg: '#ECEEF2', tagInk: '#4A5163' },
      { name: 'Abba', sub: 'Views only', initial: 'A', bg: '#E2F4EE', ink: '#1F6E58', role: 'Member', tagBg: '#ECEEF2', tagInk: '#4A5163' }
    ];
    return { members: M.map((m, i) => Object.assign({ sep: i === 0 ? 'none' : '1px solid #EEF0F4' }, m)) };
  }
}
</script>
</body>
</html>
