<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Bengali:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', 'Noto Sans Bengali', system-ui, sans-serif; color: #1D2433; padding: 96px 20px 34px; display: flex; flex-direction: column; gap: 28px">
  <span style="width: 64px; height: 64px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center">
    <svg width="28" height="34" viewBox="0 0 28 34" aria-hidden="true"><path d="M14 1C14 1 2 15 2 22a12 12 0 0 0 24 0C26 15 14 1 14 1Z" fill="#F2A007"></path></svg></span>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.025em">Choose your language</span>
    <span lang="bn" style="font-family: 'Noto Sans Bengali', sans-serif; font-size: 22px; font-weight: 700; color: #4A5163">ভাষা বেছে নিন</span>
  </div>
  <div role="radiogroup" aria-label="Language" style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">
        <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
          <span lang="{{l.lang}}" style="font-family: 'Noto Sans Bengali', 'Public Sans', sans-serif; font-size: 24px; font-weight: 700">{{l.label}}</span>
          <span style="font-size: 14px; color: #646B7E; font-weight: 500">{{l.sub}}</span>
        </span>
        <span style="{{l.dot}}"><sc-if value="{{l.on}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="check" size="13" color="#FFFFFF" hint-size="13px,13px"></dc-import></sc-if></span>
      </button>
    </sc-for>
  </div>
  <span style="font-size: 14px; color: #646B7E; text-align: center; margin-top: auto">You can change this later in You › Language.</span>
  <a href="Welcome.dc.html" style="height: 56px; border-radius: 28px; background: #1F2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700">Continue
    <dc-import name="Icon" icon="arrow-small-right" size="18" color="#FFFFFF" hint-size="18px,18px"></dc-import></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'bn' }; }
  renderVals() {
    const L = [{ id: 'bn', label: 'বাংলা', sub: 'Bangla', lang: 'bn' }, { id: 'en', label: 'English', sub: 'ইংরেজি', lang: 'en' }];
    return {
      langs: L.map((l) => {
        const on = this.state.pick === l.id;
        return Object.assign({}, l, {
          on: on,
          pick: () => this.setState({ pick: l.id }),
          style: 'height: 92px; border-radius: 24px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font: inherit; color: #1D2433; text-align: left; ' +
            (on ? 'border: 2px solid #1F2A44; background: #FFFFFF; box-shadow: 0 10px 24px rgba(31, 42, 68, 0.10)' : 'border: 2px solid transparent; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0'),
          dot: 'width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' +
            (on ? 'background: #1F2A44' : 'border: 2px solid #CDD2DC')
        });
      })
    };
  }
}
</script>
</body>
</html>
