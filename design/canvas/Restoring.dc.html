<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restoring backup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}
</style>
</helmet>
<a href="Main.dc.html" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 96px 20px 34px; display: flex; flex-direction: column; gap: 24px">
  <div role="progressbar" aria-valuenow="14" aria-valuemin="0" aria-valuemax="23" aria-label="14 of 23 items restored" style="align-self: center; position: relative; width: 168px; height: 168px">
    <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">
      <circle cx="84" cy="84" r="72" fill="#FFFFFF" stroke="#FFF1D6" stroke-width="12"></circle>
      <circle cx="84" cy="84" r="72" fill="none" stroke="#EF9426" stroke-width="12" stroke-linecap="round" stroke-dasharray="275 452.4" transform="rotate(-90 84 84)"></circle>
    </svg>
    <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">14</span><span style="font-size: 13px; font-weight: 600; color: #646B7E">of 23 items</span></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
    <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Bringing your things back</span>
    <span style="font-size: 15px; line-height: 1.45; color: #4A5163">Keep Ambr open. About a minute on Wi-Fi.</span>
  </div>
  <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 4px 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: {{r.sep}}">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: {{r.tile}}; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Icon" icon="{{r.icon}}" size="18" color="{{r.ink}}" hint-size="18px,18px"></dc-import></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{r.name}}</span>
        <span style="{{r.stateStyle}}"><dc-import name="Icon" icon="{{r.stateIcon}}" size="12" color="{{r.stateInk}}" hint-size="12px,12px"></dc-import></span>
      </div>
    </sc-for>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      { name: 'Gree 1.5 ton AC', icon: 'air-conditioner', tile: '#E6F0FB', ink: '#2B5F8E', done: true },
      { name: 'Walton fridge', icon: 'refrigerator', tile: '#E2F4EE', ink: '#1F6E58', done: true },
      { name: 'Samsung 43" TV', icon: 'screen', tile: '#ECE9FB', ink: '#5146A8', done: false },
      { name: 'Yamaha FZ', icon: 'motorcycle', tile: '#F5EEDB', ink: '#7A6420', done: false }
    ];
    return { rows: R.map((r, i) => Object.assign({}, r, {
      sep: i === 0 ? 'none' : '1px solid #EEF0F4',
      stateIcon: r.done ? 'check' : 'clock-three', stateInk: r.done ? '#FFFFFF' : '#8F5000',
      stateStyle: 'width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: ' + (r.done ? '#1B7F4C' : '#FFEFD3')
    })) };
  }
}
</script>
</body>
</html>
