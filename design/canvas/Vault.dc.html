<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}a:hover{color:#1D2433}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 132px; display: flex; flex-direction: column; gap: 14px; position: relative">

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.025em">Vault</span>
      <span style="font-size: 14px; color: #646B7E">18 items · ৳4,85,000</span>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="Search.dc.html" aria-label="Search" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <dc-import name="Icon" icon="search" size="17" color="#1D2433" hint-size="17px,17px"></dc-import></a>
      <button aria-label="Sort: ending soonest" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <dc-import name="Icon" icon="sort-amount-down" size="17" color="#1D2433" hint-size="17px,17px"></dc-import></button>
    </div>
  </div>

  <div role="group" aria-label="Group items" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E9EBF0; border-radius: 18px; padding: 4px">
    <button aria-pressed="{{byRoom}}" onClick="{{showRoom}}" style="{{roomTab}}">By room</button>
    <button aria-pressed="{{byCat}}" onClick="{{showCat}}" style="{{catTab}}">By category</button>
  </div>

  <div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}<span style="{{f.countStyle}}">{{f.n}}</span></button>
    </sc-for>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
        <span style="font-size: 18px; font-weight: 700">{{g.name}}</span>
        <span style="font-size: 13px; color: #646B7E">{{g.count}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <a href="ItemDetail.dc.html" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 8px; display: flex; flex-direction: column; gap: 10px">
            <span style="height: 96px; border-radius: 18px; background: {{it.tile}}; display: flex; align-items: center; justify-content: center; position: relative">
              <dc-import name="Icon" icon="{{it.icon}}" size="40" color="{{it.ink}}" hint-size="40px,40px"></dc-import>
              <span style="position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 4px; background: {{it.pillBg}}; color: {{it.pillInk}}; font-size: 11px; font-weight: 700; padding: 3px 8px 3px 6px; border-radius: 999px">
                <dc-import name="Icon" icon="{{it.pillIcon}}" size="10" color="{{it.pillInk}}" hint-size="10px,10px"></dc-import>{{it.status}}</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 6px 6px">
              <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
              <span style="font-size: 12px; color: #646B7E">{{it.end}}</span>
            </span>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 32px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 56px; height: 56px; border-radius: 50%; background: #E4F4EA; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="check" size="22" color="#17704A" hint-size="22px,22px"></dc-import></span>
      <span style="font-size: 17px; font-weight: 700">{{emptyText}}</span>
    </div>
  </sc-if>

  <a href="Archive.dc.html" style="display: flex; align-items: center; gap: 12px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 14px 16px; margin-top: 4px">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #F4F5F8; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="archive" size="17" color="#4A5163" hint-size="17px,17px"></dc-import></span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Archive</span><span style="font-size: 13px; color: #646B7E">Sold or given away · 2</span></span>
    <dc-import name="Icon" icon="angle-small-right" size="20" color="#646B7E" hint-size="20px,20px"></dc-import></a>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; height: 68px; border-radius: 34px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); box-shadow: 0 0 0 1px rgba(31, 42, 68, 0.06), 0 14px 34px rgba(31, 42, 68, 0.16); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px; box-sizing: border-box; gap: 4px">
      <a href="Main.dc.html" style="border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
        <dc-import name="Icon" icon="home" size="19" color="#646B7E" hint-size="19px,19px"></dc-import>
        <span style="font-size: 12px; font-weight: 600; color: #646B7E">Home</span></a>
      <a href="Vault.dc.html" aria-current="page" style="border-radius: 28px; background: #1F2A44; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
        <dc-import name="Icon" icon="apps-solid" size="19" color="#FFFFFF" hint-size="19px,19px"></dc-import>
        <span style="font-size: 12px; font-weight: 700; color: #FFFFFF">Vault</span></a>
      <a href="You.dc.html" style="border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
        <dc-import name="Icon" icon="user" size="19" color="#646B7E" hint-size="19px,19px"></dc-import>
        <span style="font-size: 12px; font-weight: 600; color: #646B7E">You</span></a>
    </div>
    <a href="Camera.dc.html" aria-label="Add item" style="width: 68px; height: 68px; border-radius: 50%; background: #F2A007; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 0 0 6px rgba(242, 160, 7, 0.16), 0 14px 28px rgba(242, 160, 7, 0.42)">
      <dc-import name="Icon" icon="plus" size="24" color="#1D2433" hint-size="24px,24px"></dc-import></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { by: 'room', filter: 'All' }; }
  renderVals() {
    const T = {
      ac: ['air-conditioner', '#E6F0FB', '#2B5F8E'], fridge: ['refrigerator', '#E2F4EE', '#1F6E58'], tv: ['screen', '#ECE9FB', '#5146A8'],
      phone: ['mobile-notch', '#FDEBDD', '#9A4A16'], fan: ['fan', '#ECEEF2', '#5F6577'], laptop: ['laptop', '#E8EDF4', '#3E5568'],
      bike: ['motorcycle', '#F5EEDB', '#7A6420'], washer: ['washer', '#E3EFF7', '#2F5F7A']
    };
    const S = {
      'Covered': { pillBg: '#E4F4EA', pillInk: '#17704A', pillIcon: 'check' },
      'Ends soon': { pillBg: '#FFEFD3', pillInk: '#8F5000', pillIcon: 'clock-three' },
      'Expired': { pillBg: '#ECEEF2', pillInk: '#5F6577', pillIcon: 'minus-circle' }
    };
    const items = [
      { name: 'Redmi Note 13', t: 'phone', room: 'Bedroom', cat: 'Phones & tablets', s: 'Ends soon', end: 'Ends 30 Oct 2026' },
      { name: 'Samsung 43" TV', t: 'tv', room: 'Living room', cat: 'TV & audio', s: 'Ends soon', end: 'Ends 6 Nov 2026' },
      { name: 'Gree 1.5 ton AC', t: 'ac', room: 'Bedroom', cat: 'Cooling', s: 'Covered', end: 'Until 14 Mar 2027' },
      { name: 'Walton fridge', t: 'fridge', room: 'Kitchen', cat: 'Cooling', s: 'Covered', end: 'Until 20 Oct 2027' },
      { name: 'Singer washer', t: 'washer', room: 'Kitchen', cat: 'Kitchen appliances', s: 'Covered', end: 'Until 2 Feb 2028' },
      { name: 'HP laptop', t: 'laptop', room: 'Office', cat: 'Computers', s: 'Covered', end: 'Until 11 Jul 2027' },
      { name: 'Vision ceiling fan', t: 'fan', room: 'Bedroom', cat: 'Cooling', s: 'Expired', end: 'Ended 3 Jan 2026' },
      { name: 'Walton TV 32"', t: 'tv', room: 'Living room', cat: 'TV & audio', s: 'Expired', end: 'Ended 18 Aug 2025' }
    ];
    const f = this.state.filter;
    const shown = items.filter((i) => f === 'All' || i.s === f);
    const key = this.state.by === 'room' ? 'room' : 'cat';
    const names = [];
    shown.forEach((i) => { if (names.indexOf(i[key]) < 0) names.push(i[key]); });
    const groups = names.map((n) => {
      const list = shown.filter((i) => i[key] === n);
      return {
        name: n, count: list.length + (list.length === 1 ? ' item' : ' items'),
        items: list.map((i) => Object.assign({ name: i.name, end: i.end, status: i.s, icon: T[i.t][0], tile: T[i.t][1], ink: T[i.t][2] }, S[i.s]))
      };
    });
    const chip = (on) => 'height: 40px; padding: 0 8px 0 14px; border-radius: 20px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: none; display: flex; align-items: center; gap: 8px; ' +
      (on ? 'border: 1px solid #1F2A44; background: #1F2A44; color: #FFFFFF' : 'border: 1px solid #E3E6EC; background: #FFFFFF; color: #1D2433');
    const cnt = (on) => 'min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; ' +
      (on ? 'background: #F2A007; color: #1D2433' : 'background: #F4F5F8; color: #4A5163');
    const counts = { 'All': 18, 'Covered': 13, 'Ends soon': 2, 'Expired': 3 };
    const tab = (on) => 'height: 42px; border-radius: 14px; border: none; font: inherit; font-size: 15px; cursor: pointer; ' +
      (on ? 'background: #FFFFFF; color: #1D2433; font-weight: 700; box-shadow: 0 1px 3px rgba(31, 42, 68, 0.10)' : 'background: transparent; color: #646B7E; font-weight: 600');
    const emptyText = { 'Expired': 'No expired items. Nice.', 'Ends soon': 'All good. Nothing ending soon.', 'Covered': 'Nothing covered right now.', 'All': 'Nothing saved yet.' };
    return {
      byRoom: this.state.by === 'room', byCat: this.state.by !== 'room',
      roomTab: tab(this.state.by === 'room'), catTab: tab(this.state.by !== 'room'),
      showRoom: () => this.setState({ by: 'room' }), showCat: () => this.setState({ by: 'cat' }),
      filters: Object.keys(counts).map((k) => ({ label: k, n: counts[k], on: f === k, style: chip(f === k), countStyle: cnt(f === k), pick: () => this.setState({ filter: k }) })),
      groups: groups, empty: groups.length === 0, emptyText: emptyText[f]
    };
  }
}
</script>
</body>
</html>
