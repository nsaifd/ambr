<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What broke?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2433;text-decoration:none}a:hover{color:#1D2433}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F4F5F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1D2433; padding: 54px 16px 32px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center">
      <dc-import name="Icon" icon="angle-small-left" size="22" color="#1D2433" hint-size="22px,22px"></dc-import></a>
    <a href="Main.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
      <dc-import name="Icon" icon="search" size="15" color="#1D2433" hint-size="15px,15px"></dc-import>Search instead</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
    <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.025em">What broke?</span>
    <span style="font-size: 16px; line-height: 1.45; color: #4A5163">Tap it. We'll open the receipt, the serial number and the service center.</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <a href="ClaimPack.dc.html" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; padding: 8px; display: flex; flex-direction: column; gap: 10px">
        <span style="height: 112px; border-radius: 18px; background: {{it.tile}}; display: flex; align-items: center; justify-content: center; position: relative">
          <dc-import name="Icon" icon="{{it.icon}}" size="46" color="{{it.ink}}" hint-size="46px,46px"></dc-import>
          <span style="position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 4px; background: {{it.pillBg}}; color: {{it.pillInk}}; font-size: 11px; font-weight: 700; padding: 3px 8px 3px 6px; border-radius: 999px">
            <dc-import name="Icon" icon="{{it.pillIcon}}" size="10" color="{{it.pillInk}}" hint-size="10px,10px"></dc-import>{{it.status}}</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 1px; padding: 0 6px 6px">
          <span style="font-size: 17px; font-weight: 700">{{it.name}}</span>
          <span style="font-size: 13px; color: #646B7E">{{it.room}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <a href="Vault.dc.html" style="height: 52px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 0 0 1px #E8EAF0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Show all 18 items</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      c: { status: 'Covered', pillBg: '#E4F4EA', pillInk: '#17704A', pillIcon: 'check' },
      s: { status: 'Ends soon', pillBg: '#FFEFD3', pillInk: '#8F5000', pillIcon: 'clock-three' },
      x: { status: 'Expired', pillBg: '#ECEEF2', pillInk: '#5F6577', pillIcon: 'minus-circle' }
    };
    const items = [
      ['AC', 'Bedroom', 'air-conditioner', '#E6F0FB', '#2B5F8E', 'c'],
      ['Fridge', 'Kitchen', 'refrigerator', '#E2F4EE', '#1F6E58', 'c'],
      ['TV', 'Living room', 'screen', '#ECE9FB', '#5146A8', 's'],
      ['Phone', 'Rafi', 'mobile-notch', '#FDEBDD', '#9A4A16', 's'],
      ['Washer', 'Bathroom', 'washer', '#E3EFF7', '#2F5F7A', 'c'],
      ['Motorbike', 'Car / bike', 'motorcycle', '#F5EEDB', '#7A6420', 'c'],
      ['Ceiling fan', 'Bedroom', 'fan', '#ECEEF2', '#5F6577', 'x'],
      ['Laptop', 'Office', 'laptop', '#E8EDF4', '#3E5568', 'c']
    ];
    return { items: items.map((i) => Object.assign({ name: i[0], room: i[1], icon: i[2], tile: i[3], ink: i[4] }, S[i[5]])) };
  }
}
</script>
</body>
</html>
